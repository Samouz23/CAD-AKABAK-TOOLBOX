  <title>NumRings=</title>

<body>
  <h1 class=param>NumRings=</h1>
  <p class=navi><a href="../../Index.html">Home</a> &raquo;
                <a href="../Scripts.html">Scripts</a></p>
  <hr>

  <table class=param>
  <tr>
    <td class=param0>Identifier</td>   <td class=paramID>NumRings=</td>
  </tr>
  <tr>
    <td class=param0>Format</td>       <td class=param1>Integer</td>
  </tr>
  <tr>
    <td class=param0>Purpose</td>      <td class=param1>Resolution of <a href="../../Appendix/Meshing.html">Bifu</a>-meshing</td>
  </tr>
  <tr>
    <td class=param0>Used in</td>      <td class=param1 COLSPAN=2>
                                                        <a href="../Sections/Diaphragm.html">Diaphragm</a>,
                                                        <a href="../Sections/Shell.html">Shell</a></td>
  </tr>
  </table>

  <hr>

  <p>If <a href="Meshing=.html">Meshing=Bifu</a> then <i>NumRings=</i>
  controls the mesh of circular shapes of
  <a href="../Sections/Diaphragm.html">Diaphragm</a> and
  <a href="../Sections/Shell.html">Shell</a>.</p>

  <p>By default <i>NumRings=2</i>.</p>


  <br>
