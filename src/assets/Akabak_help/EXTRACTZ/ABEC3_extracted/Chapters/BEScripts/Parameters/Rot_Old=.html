  <p>The parameter <i>Rot=</i> is depreciated and should be replaced by parameter
  <a href="Rotate=.html">Rotate=</a>. <i>Rot=</i> will be kept for compatibility reasons.</p>

  <p><i>Rot=</i> erroneously yields the inverse rotation of
  the correct parameter <a href="Rotate=.html">Rotate=</a>.</p>
