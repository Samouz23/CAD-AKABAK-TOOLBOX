  <h1>String Values</h1>
  <p class=navi><a href="../Index.html">Home</a>
  <hr>

  <p>String parameters take a name or an alias as value. ABEC is not
  case-sensitive, except for <a href="Units.html">units</a>.
  If there are blanks inside the string you need to encapsulate
  the string in quotes. Examples are</p>
  <pre>
  MeshFileAlias=M
  RefDiaphragm="Top Left"
  RefNodes="Nodes 1"</pre>


  <br>
  <br>
