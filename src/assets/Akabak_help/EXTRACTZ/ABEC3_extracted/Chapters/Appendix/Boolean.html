  <h1>Boolean Values</h1>
  <p class=navi><a href="../Index.html">Home</a>
  <hr>

  <p>Boolean parameters work as a switch. Its state can be either
  true or false. Examples are</p>
  <pre>
  SwapNormals=true
  HasBaffle=true</pre>

  <p>Alternatively you can simply state a command by omitting the "=true",
  for example:</p>

  <pre>
  SwapNormals
  HasBaffle</pre>


  <br>
  <br>
</body>
