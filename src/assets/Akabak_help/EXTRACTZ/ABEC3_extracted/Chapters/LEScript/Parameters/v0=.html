  <title>v0=</title>
  <link href="../../../_styles/ABEC3_Help.css" type="text/css" rel="StyleSheet">
</head>

<body>
  <h1 class=param>v0=</h1>
  <p class=navi><a href="../../Index.html">Home</a> &raquo;
                <a href="../LEScripts.html">LE-Scripts</a></p>
  <hr>

  <table class=param>
  <tr>
    <td class=param0>Identifier</td>   <td class=paramID>v0=</td>
  </tr>
  <tr>
    <td class=param0>Format</td>       <td class=param1><a href="../../Appendix/Floating%20point%20values.html">Floating point number</a></td>
  </tr>
  <tr>
    <td class=param0>Purpose</td>      <td class=param1>Amplification</td>
  </tr>
  <tr>
    <td class=param0>Used in</td>      <td class=param1 COLSPAN=2>
                                                        <a href="../Sections/Filter.html">Filter</a>,
                                                        <a href="../Sections/OpAmp.html">OpAmp</a>
                                                        </td>
  </tr>
  </table>

  <hr>

  <p><i>v0=</i> specifies the open-loop amplification of the device:</p>

  <p class=formula>U<sub>2</sub> = v0&middot;H(s)&middot;U<sub>1</sub></p>

  <p>with U2 and U1 the output and input voltages of the device.
  H(s) is the transfer-function.</p>

  <p>By default v0 = 1</p>

  <br>
  <br>
</body>
