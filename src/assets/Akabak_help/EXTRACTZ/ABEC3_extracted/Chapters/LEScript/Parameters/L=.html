  <h1 class=param>L=</h1>
  <p class=navi><a href="../../Index.html">Home</a> &raquo;
                <a href="../LEScripts.html">LE-Scripts</a></p>
  <hr>

  <table class=param>
  <tr>
    <td class=param0>Identifier</td>   <td class=paramID>L=</td>
  </tr>
  <tr>
    <td class=param0>Units</td>       <td class=param1><a href="../../Appendix/Units.html">H</a></td>
  </tr>
  <tr>
    <td class=param0>Format</td>       <td class=param1><a href="../../Appendix/Floating%20point%20values.html">Floating point number</a></td>
  </tr>
  <tr>
    <td class=param0>Purpose</td>      <td class=param1>Inductance.</td>
  </tr>
  <tr>
    <td class=param0>Used in</td>      <td class=param1 COLSPAN=2>
                                                        <a href="../Sections/Coil.html">Coil</a>
                                                        </td>
  </tr>
  </table>

  <hr>

  <p><i>L=</i> is the inductance of the Coil component.
  Units are [L] = H (Henry).</p>

  <p>For example</p>

  <pre>
  <b>Coil</b>  'L1'
    Node=2=0
    L=1mH
  </pre>
