<body><table><tr><td width=1000>  <h1>String Values</h1>
  <p class=navi><a href="../Index.html">Home</a>
  <hr>

  <p>String parameters take text as value. Strings are used for Captions,
  Formula, Annotations and Filenames.</p>

  <p>Blanks are allowed, but tabs.</p>

  <p>File-names and folder-names should avoid
  characters which are reserved for OS-operations such as "/", "\", ":", "."</p>
