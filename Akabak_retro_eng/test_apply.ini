[raw_constants]
////////CONSTANTE/////////
WOOD_THICKNESS = 18
RMIN           = 70
DAMPING        = 0.1
WOOD           = 0.05

//////////DIMENSION//////////
HEIGHT = 200
WIDTH  = 300
DEPT   = 400

//////////PPBOX RADIATION//////////
MOUTH_H = HEIGHT
MOUTH_D = WIDTH - 2*WOOD_THICKNESS

// Global Dimensions (Height)
H = @HEIGHT*@n - (2*@n)*@WOOD_THICKNESS

// Largeurs des Ducts (D)
D1 = 50
D2 = 60
// Horn Width (S)
S1 = D1
S2 = D2

[Duct.1]
WD  = @D1
HD  = @H
Len = @DL1
eta = @WOOD
Vf = 0
Visc = 1

[Duct.0]
WD  = @D2
HD  = @H
Len = @DL2
eta = @WOOD
Vf = 0
Visc = 1

[names]
Duct.1 = Du1
Duct.0 = Du2
